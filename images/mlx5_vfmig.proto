/*
 * Plugin-private image schema for the mlx5_sriov_vfmig CRIU plugin.
 *
 * Lives under criu/images/ rather than under plugins/rdma/mlx5_sriov_vfmig/
 * for two reasons:
 *   1. The pb-c headers go through the same protoc + dependency-tracking
 *      pipeline as the rest of the criu image schema, so the plugin can
 *      just `#include "images/mlx5_vfmig.pb-c.h"` like any other image
 *      record.
 *   2. `crit decode` learns the schema for free, so an operator
 *      debugging an mlx5_vfmig dump can inspect the per-context
 *      records without running the plugin's restore-side reader.
 *
 * Image layout written by the plugin's CR_PLUGIN_HOOK__RDMA_DUMP_UVERBS_
 * CONTEXT implementation:
 *
 *   <img-dir>/mlx5_vfmig.img
 *       Sequence of length-prefixed mlx5_vfmig_state_entry records
 *       (one per dumped uverbs context). The plugin writes records
 *       in dump order; the restore side reads them all up front and
 *       indexes by ctxn.
 *
 *   <img-dir>/mlx5_vfmig-pf<bdf>-vf<id>.blob
 *       Raw firmware-state blob produced by
 *       MLX5_VFMIG_IOC_SAVE_VHCA_STATE { vf_id, KEEP_SUSPENDED }.
 *       One blob per (pf_bdf, vf_id) tuple. Multiple uverbs contexts
 *       on the same VF reference the same blob -- the SAVE is at VF
 *       granularity, not per-context.
 *
 * The join key between mlx5_vfmig_state_entry.ctxn and the generic
 * uverbs_file_entry.ctxn is enforced by both sides: dump records the
 * ctxn it was handed by criu/rdma.c, restore looks up by ctxn. ibdev
 * is recorded redundantly for human-readability of the image (`crit
 * decode` will surface it) and for an integrity cross-check on
 * restore.
 */

syntax = "proto2";

message mlx5_vfmig_state_entry {
	/*
	 * uverbs context number, from /proc/<pid>/fdinfo of the
	 * source uverbs cdev. Same value the parent
	 * uverbs_file_entry carries -- restore uses this as the join
	 * key to match a saved blob to the uverbs cdev being
	 * restored.
	 */
	required uint32		ctxn		= 1;

	/*
	 * ibdev name as resolved on the source (e.g. "mlx5_2"). Not
	 * used as a join key on restore -- the destination's ibdev
	 * for the same VF may differ -- but recorded for diagnostics
	 * and for an integrity cross-check ("did the operator point
	 * us at a wildly wrong VF?"). The destination ibdev is
	 * resolved from the (pf_bdf, vf_id) tuple at restore time.
	 */
	required string		ibdev		= 2;

	/*
	 * Source PF BDF (e.g. "0000:b1:00.0"), useful for log
	 * correlation against the source-side mlx5_vfmig kernel
	 * traces. Not used as a key on restore -- the destination's
	 * PF BDF will differ (different host) -- but indispensable
	 * when triaging "which source VF was this snapshot from".
	 */
	required string		pf_bdf		= 3;

	/*
	 * Source vf_id within its PF, in the same numbering the
	 * MLX5_VFMIG_IOC_* ioctls use. Diagnostic only on restore
	 * (the destination vf_id is whatever the orchestrator
	 * allocates to us); recorded so an operator inspecting a
	 * dumped image with `crit decode` can correlate against the
	 * source PF's sysfs.
	 */
	required uint32		vf_id		= 4;

	/*
	 * Source vhca_id captured at SAVE time (returned by
	 * MLX5_VFMIG_IOC_GET_VHCA_ID). The destination's vhca_id
	 * after LOAD_VHCA_STATE is allocated by the destination's
	 * firmware and will differ; this field is recorded for
	 * diagnostics and to let the restore side log a useful
	 * before/after pair.
	 */
	required uint32		vhca_id		= 5;

	/*
	 * Basename (relative to the CRIU image dir) of the firmware
	 * blob file holding the SAVE_VHCA_STATE byte stream for
	 * (pf_bdf, vf_id). Multiple state entries in the same image
	 * may share a blob_path -- one VF, multiple contexts.
	 */
	required string		blob_path	= 6;

	/*
	 * Byte length of the blob file. Restore uses this to size
	 * the LOAD_VHCA_STATE write up front.
	 */
	required uint64		blob_size	= 7;

	/*
	 * SHA-256 of the blob, as a 64-char lowercase hex string.
	 * Optional: useful for end-to-end image integrity checks
	 * (the firmware blob is opaque so a corrupted byte stream
	 * would otherwise only surface as a LOAD_VHCA_STATE failure
	 * during restore). Plugin always populates it on dump; the
	 * field is optional only so older images would still parse.
	 */
	optional string		blob_sha256	= 8;

	/*
	 * Source-side cdev path (e.g. "/dev/infiniband/uverbs2") of
	 * the uverbs cdev this context was opened against on the
	 * source. Captured at dump time via readlink() against the
	 * lfd that DUMP_UVERBS_CONTEXT receives.
	 *
	 * Restore uses this as the join key for UPDATE_VMA_MAP: the
	 * VMA records in the standard CRIU image carry the source
	 * cdev path verbatim (CRIU records reg_file_entry.name
	 * without rewriting), and the plugin's eager-init restore
	 * caches per-source-path destination cdev fds. UPDATE_VMA_MAP
	 * receives @path = source_cdev_path, looks it up in the
	 * cache, and hands back a dup() of the dest cdev fd plus the
	 * source's pgoff verbatim.
	 *
	 * On a single-host dump-then-restore (the common case for
	 * v0) the destination's cdev path will typically be the
	 * same string, but we deliberately don't rely on that --
	 * different probe order, post-reboot churn, or rdma_link
	 * add/delete will move the path. The plugin always re-
	 * resolves the destination cdev via /sys/class/infiniband_
	 * verbs/uverbsN/ibdev after LOAD_VHCA_STATE + bind, and
	 * uses source_cdev_path purely as a per-process-tree key
	 * into its own cache.
	 *
	 * Required because UPDATE_VMA_MAP receives only the source
	 * path and must dispatch on it; without this field the
	 * plugin would need to walk every loaded
	 * mlx5_vfmig_state_entry per VMA to find a match.
	 */
	required string		source_cdev_path	= 9;

	/*
	 * VFMIG ucontext snapshot, captured at dump time on the
	 * source's uverbs cdev fd via two-pass
	 * MLX5_IB_METHOD_VFMIG_QUERY_UCONTEXT (kernel UAPI in
	 * include/uapi/rdma/mlx5_user_ioctl_cmds.h). Replayed at
	 * restore time after the destination ucontext is opened with
	 * MLX5_IB_ALLOC_UCTX_VFMIG_RESTORE: the plugin issues
	 * MLX5_IB_METHOD_VFMIG_RESTORE_UCONTEXT to seed the
	 * destination's bfregi->sys_pages[] with the source's FW UAR
	 * ids verbatim, skipping the per-slot ALLOC_UAR FW commands
	 * that mlx5_ib_alloc_ucontext() would normally issue.
	 *
	 * Without this snapshot the destination's GET_CONTEXT call
	 * after LOAD_VHCA_STATE returns -EINVAL: the FW UARs that
	 * were live on the source VHCA are now reserved in the
	 * destination VHCA (carried over by LOAD_VHCA_STATE), and
	 * mlx5_ib_alloc_ucontext()'s allocate_uars() loop tries to
	 * ALLOC_UAR new ids and the firmware rejects.
	 *
	 * uctx_meta: opaque-to-criu serialized
	 *     `struct mlx5_ib_vfmig_ucontext_meta` (32 bytes; see
	 *     include/uapi/rdma/mlx5_user_ioctl_cmds.h). Carried as
	 *     bytes, not broken out into individual proto fields,
	 *     because the kernel handler does a strict bitwise
	 *     equality check on every field at RESTORE_UCONTEXT
	 *     time -- preserving wire byte-identity is what the
	 *     handler needs, and exposing the struct as bytes makes
	 *     the criu side oblivious to fields the kernel may add
	 *     in future minor revisions of the meta blob.
	 *
	 * uctx_uar_table: snapshot of bfregi->sys_pages[], length
	 *     equals meta.num_sys_pages. Each entry is an opaque
	 *     32-bit FW UAR id (or MLX5_IB_INVALID_UAR_INDEX for an
	 *     unallocated dynamic slot). Replayed verbatim by
	 *     RESTORE_UCONTEXT.
	 *
	 * uctx_bfreg_count: snapshot of bfregi->count[], length
	 *     equals meta.total_num_bfregs. v0 enforces all entries
	 *     are zero (no live QPs / claimed dyn UARs to restore);
	 *     this remains in the wire format so a future MR/QP
	 *     restore step can lift the constraint without an ABI
	 *     bump. Stored as bytes for the same wire-shape-locked
	 *     reasons as uctx_meta.
	 *
	 * All three are optional purely for forward/back-compat
	 * with the v0 image written before Step 3 landed: an image
	 * dumped without uctx_* will fail RESTORE with a clear
	 * "image predates VFMIG_RESTORE_UCONTEXT support" message
	 * rather than silently producing a broken ucontext.
	 *
	 * EXACTLY ONE of {uctx_meta + uctx_uar_table (+ uctx_bfreg_count)}
	 * vs uctx_dyn_uar_records is populated per entry, depending on
	 * which mode the source ucontext ran in. See uctx_dyn_uar_records
	 * below for the lib_uar_dyn=true counterpart. An entry carrying
	 * neither is treated as a pre-Step-3 image and rejected on
	 * restore.
	 */
	optional bytes		uctx_meta		= 10;
	optional bytes		uctx_uar_table		= 11;
	optional bytes		uctx_bfreg_count	= 12;

	/*
	 * VFMIG dynamic-UAR ucontext snapshot. Populated when the source
	 * ucontext was opened by libmlx5 in lib_uar_dyn=true mode (the
	 * default for modern libmlx5: MLX5_LIB_CAP_DYN_UAR is advertised
	 * automatically). In that mode mlx5_ib_alloc_ucontext bypasses
	 * bfregi->sys_pages[] entirely; UARs are MLX5_IB_OBJECT_UAR
	 * uobjects allocated lazily via MLX5_IB_METHOD_UAR_OBJ_ALLOC and
	 * exposed to userspace as (handle, mmap_offset) pairs.
	 *
	 * Captured at dump time via two-pass
	 * MLX5_IB_METHOD_VFMIG_QUERY_DYN_UARS (which the kernel rejects
	 * for static ucontexts with -EINVAL, and the static
	 * QUERY_UCONTEXT verb rejects dyn ucontexts with -EOPNOTSUPP --
	 * exactly-one-of-two by construction). Replayed at restore time
	 * after a destination ucontext is opened with
	 * MLX5_IB_ALLOC_UCTX_VFMIG_RESTORE | MLX5_LIB_CAP_DYN_UAR via
	 * MLX5_IB_METHOD_VFMIG_RESTORE_DYN_UARS, which pins each
	 * MLX5_IB_OBJECT_UAR uobject at its source-side handle and
	 * re-inserts the rdma_user_mmap_entry at the same start_pgoff,
	 * so userspace's captured (handle, mmap_offset) pairs round-trip
	 * byte-for-byte against the destination ucontext.
	 *
	 * Wire shape: contiguous array of `struct
	 * mlx5_ib_vfmig_dyn_uar_record` (24 bytes each; see
	 * include/uapi/rdma/mlx5_user_ioctl_cmds.h). Carried as opaque
	 * bytes for the same wire-shape-locked rationale as uctx_meta /
	 * uctx_uar_table -- the kernel's QUERY/RESTORE handlers exchange
	 * the same struct verbatim, so byte-identity is exactly the
	 * round-trip property userspace cares about.
	 */
	optional bytes		uctx_dyn_uar_records	= 13;

	/*
	 * Orchestrator-stamped per-VF UUID (KS7.3). 16 raw bytes,
	 * captured at dump time via MLX5_VFMIG_IOC_QUERY_VF on the
	 * source PF cdev. Must be present and non-zero in every
	 * record this plugin emits: the dump path hard-refuses to
	 * write a Mlx5VfmigStateEntry whose source VF's vf_uuid
	 * comes back all-zeros, on the assumption that the
	 * orchestrator (libvirt / kubevirt / equivalent) has
	 * stamped a stable identity onto the VF before workload
	 * binding.
	 *
	 * The orchestrator owns the UUID. CRIU never calls
	 * MLX5_VFMIG_IOC_SET_VF_UUID -- the dump path only reads
	 * the kernel's slot, the restore path iterates eligible
	 * destination PFs/VFs and binds this saved-state record
	 * to whichever VF QUERY_VF reports a matching vf_uuid.
	 *
	 * Required because every dumped record carries one. An
	 * image whose entries lack vf_uuid would be ambiguous on
	 * restore -- there is no fallback identity (vhca_id is
	 * not stable across SAVE/LOAD; vf_id and pf_bdf are
	 * orchestrator-assignable on the destination), so a
	 * missing UUID is unrecoverable.
	 *
	 * See KS7.3 in tools/testing/criu_rdma/design/
	 * vf_prerestore_split.md §3.5 for the full lifecycle
	 * (orchestrator-stamps-on-provision, kernel-clears-on-
	 * sriov-numvfs=0, CRIU-reads-only).
	 */
	required bytes		vf_uuid			= 15;

	/*
	 * Source-side DEVX uid that owned the ucontext at dump time
	 * (mlx5_ib_ucontext.devx_uid as observed by the source).
	 * Values:
	 *
	 *   absent / 0  -- non-DEVX libibverbs ucontext (lib_uar_dyn=
	 *                  false). Restore opens the destination
	 *                  ucontext with the same shape -- no DEVX,
	 *                  no UID adoption. adopt_devx_uid stays 0.
	 *
	 *   1..U16_MAX  -- DEVX-opted-in ucontext (modern libmlx5
	 *                  default with lib_uar_dyn=true silently
	 *                  opts in, even with no explicit
	 *                  mlx5dv_open_device(MLX5DV_CONTEXT_FLAGS_
	 *                  DEVX) call). At restore-time, the plugin
	 *                  must open the destination ucontext with
	 *                  flags = MLX5_IB_ALLOC_UCTX_VFMIG_RESTORE
	 *                        | MLX5_IB_ALLOC_UCTX_DEVX
	 *                        | MLX5_IB_ALLOC_UCTX_ADOPT_DEVX_UID
	 *                  and adopt_devx_uid = source_devx_uid.
	 *                  The kernel's mlx5_ib_alloc_ucontext()
	 *                  skips devx_create() and adopts the
	 *                  caller-supplied uid into context->
	 *                  devx_uid. The subsequent ALLOC_TRANSPORT_
	 *                  DOMAIN doubles as a FW-liveness probe:
	 *                  a stale/wrong uid surfaces as -EINVAL or
	 *                  similar up the alloc-ucontext path.
	 *
	 * Provenance: sourced at dump-time by the plugin's
	 * DUMP_UVERBS_CONTEXT hook from QUERY_UCONTEXT's
	 * meta.devx_uid (kernel commit c659ab66483d). The earlier
	 * per-ucontext NLDEV PD walk over each PD's "fw_uid" driver
	 * TLV was removed when the kernel dropped those TLVs; the
	 * per-PD uid is now available via MLX5_IB_METHOD_VFMIG_QUERY_PD's
	 * RESP_UID (dump-side diagnostic only). The dyn-UAR / DEVX
	 * source path leaves meta.devx_uid (hence this field) 0.
	 *
	 * Image-only metadata: NOT consumed at restore. The v0
	 * restore path always opens the destination ucontext WITHOUT
	 * DEVX (adopt_devx_uid forced to 0), because LOAD_VHCA_STATE
	 * does not preserve the FW uctx registration table, so a
	 * non-zero uid is unrecoverable. The FW pdn RESTORE_PD adopts
	 * travels per-PD in rdma_uobj_entry.plugin_blob (struct
	 * mlx5_ib_restore_pd_req), captured via QUERY_PD -- not via
	 * this field or the removed NLDEV fw_pdn TLV.
	 */
	optional uint32		source_devx_uid		= 14;
}
