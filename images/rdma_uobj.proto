/*
 * Per-uobject image schema for R3: the per-context DAG of ib_uobjects
 * (PD / CQ / QP / MR / SRQ / AH / completion-channel-fd / async-event-fd)
 * captured at dump and replayed at restore.
 *
 * Sequenced under the design described in
 *   linux/tools/testing/mlx5_vfmig/DESIGN_R3_uobj_restore.md
 * Builds on top of uverbs_file_entry (uverbsfd.proto): every
 * rdma_uobj_entry refers back to the parent uverbs_file_entry.id
 * via ufile_id, and per-driver plugin state per uobject lives in
 * the opaque plugin_blob (recommended encoding: a per-plugin .proto,
 * see for example mlx5_vfmig.proto, but criu core never parses these
 * bytes).
 *
 * Image layout written by criu/rdma.c at dump time:
 *
 *   <img-dir>/rdma_uobj.img
 *       Sequence of length-prefixed rdma_uobj_entry records, one per
 *       ib_uobject discovered across all dumped uverbs files. Records
 *       are not ordered; the restore side topo-sorts via the xref
 *       graph. Each record carries enough identity (ufile_id + type
 *       + ufile_handle + restrack_id) to be its own join key.
 *
 * Two distinct identifiers per uobject -- both load-bearing:
 *
 *   ufile_handle: small integer (typically 0..N), per-uverbs-file id
 *                 space. This is what user code sees as e.g. pd->handle
 *                 or qp->handle. Restore must install the new
 *                 ib_uobject at the same value so user code's saved
 *                 handles remain valid.
 *
 *   restrack_id:  per-ibdev integer assigned by the rdma_restrack
 *                 subsystem. Surfaced via NLDEV (rdma resource show)
 *                 as the per-resource `id`, and used by NLDEV's own
 *                 cross-resource references (PDN-of-QP, CQN-of-QP,
 *                 ...). R3 uses it as the xref edge target (see
 *                 rdma_uobj_xref). Note this *is* user-visible via
 *                 NLDEV: any consumer caching by restrack_id breaks
 *                 silently across restore (fresh ids on the
 *                 destination ibdev). Documented in the design doc
 *                 as a known externally-visible identity discontinuity.
 */

syntax = "proto2";

import "rdma_criu.proto";

/*
 * UVERBS_OBJECT_* coverage. v0 lists only types R3 will dump in
 * the first cut (PD/CQ/QP/MR/SRQ/AH/CC/AEF). The remaining types
 * (DM, DEVX_*, MW, FLOW, XRCD, CM_ID) are placeholders: the enum
 * reserves their integers so the wire format stays stable as
 * follow-on stages add them. Image consumers MUST tolerate
 * unknown values (a future criu may emit them; crit / older criu
 * should ignore the entry rather than crash).
 *
 * Names are R3UT_-prefixed because proto2 enum values share a
 * global namespace across the criu image schema; bare PD/CQ/QP
 * collide trivially. The prefix matches the enum-name initials.
 */
enum r3_uobj_type {
	R3UT_UNKNOWN			= 0;
	R3UT_PD				= 1;
	R3UT_CQ				= 2;
	R3UT_QP				= 3;
	R3UT_MR				= 4;
	R3UT_SRQ			= 5;
	R3UT_AH				= 6;
	R3UT_COMP_CHANNEL_FILE		= 7;
	R3UT_ASYNC_EVENT_FILE		= 8;
	/* Reserved for follow-on stages: */
	R3UT_DM				= 9;
	R3UT_DEVX_OBJ			= 10;
	R3UT_DEVX_UMEM			= 11;
	R3UT_MW				= 12;
	R3UT_FLOW			= 13;
	R3UT_XRCD			= 14;
	R3UT_CM_ID			= 15;
};

/*
 * Edge label in the per-ucontext DAG. Names a typed reference from
 * one uobject to another. The set is intentionally small in v0:
 * everything an ib_write_bw workload needs.
 *
 * Reserved values exist so follow-on stages (DM, DEVX, XRCD, ...)
 * can be added without renumbering. Unknown roles are tolerable on
 * decode (skip the edge with a warning) for forward compatibility.
 */
enum r3_xref_role {
	R3XR_UNKNOWN			= 0;
	R3XR_PARENT_PD			= 1;
	R3XR_SEND_CQ			= 2;
	R3XR_RECV_CQ			= 3;
	R3XR_SRQ			= 4;
	R3XR_COMP_CHANNEL		= 5;
	/* Reserved for follow-on: */
	R3XR_DM				= 6;
	R3XR_XRCD			= 7;
	R3XR_DEVX_UAR			= 8;
};

/*
 * One typed reference from a source uobject to a target uobject.
 * The (target_type, target_restrack_id) pair uniquely identifies
 * the target inside the same image. Restore resolves to the
 * destination-side ufile_handle via the per-ufile handle map
 * built up as uobjects are restored in topo order.
 */
message rdma_uobj_xref {
	required r3_xref_role	role			= 1;
	required r3_uobj_type	target_type		= 2;
	required uint32		target_restrack_id	= 3;
};

/* ---------------- per-class hw-agnostic attribute messages ---------------- */

/*
 * PD has no wire-visible identity and only carries access-style
 * flags (currently empty for v0; PD allocation is access-flag-less
 * in IB verbs). FW pdn lives in plugin_blob, not here.
 */
message rdma_pd_attrs {
	optional uint32		alloc_flags		= 1;
};

/*
 * CQ hw-agnostic state. Driver-private CQ payload (rxe: source
 * vm_pgoff; mlx5: 32B mlx5_ib_restore_cq_req) is NOT a field here
 * -- it lives in the per-uobj entry-level @plugin_blob, packed and
 * unpacked by the per-driver RDMA plugin. Comp-channel binding is
 * encoded as an xref (R3XR_COMP_CHANNEL) not a field here, so the
 * same shape covers "no channel" uniformly.
 *
 * Field provenance:
 *   cqe_count     NLDEV RES_CQE (always present from S1.b dump).
 *   comp_vector   not in NLDEV; plugin fills via RDMA_DUMP_UOBJ_CQ
 *                 from a driver-private query (mlx5:
 *                 MLX5_IB_METHOD_VFMIG_QUERY_CQ.RESP_COMP_VECTOR;
 *                 rxe: hard-zero, the rxe path has only one
 *                 vector). Optional. The kernel verb takes
 *                 comp_vector as a core MANDATORY attr at restore
 *                 time, so absent here means "0".
 *   flags         not in NLDEV; plugin fills via RDMA_DUMP_UOBJ_CQ.
 *                 Mirrors `enum ib_create_cq_flags`. Optional.
 *
 * Driver-private fields that USED to live here (mmap_offset, the
 * 32B mlx5_blob) moved into the entry-level plugin_blob in the v0
 * series itself; older partial dumps with those fields populated
 * are not restorable on this code base (and never will be -- v0
 * is unreleased).
 */
message rdma_cq_attrs {
	optional uint32		cqe_count		= 1;
	optional uint32		comp_vector		= 2;
	optional uint32		flags			= 3;
};

/*
 * QP capability fields, mirroring `struct ib_qp_cap` 1:1. Snapshot
 * at dump from CMD_QUERY_QP; restore passes through to
 * ib_qp_init_attr.cap.
 *
 * All fields are optional in the wire format because NLDEV's
 * fill_res_qp_entry does NOT emit ib_qp_cap (the kernel calls
 * ib_query_qp internally but only puts a subset of qp_attr/init_attr
 * into the message). Filled progressively: S2/S3+ via the plugin
 * blob until a kernel emission lands that surfaces ib_qp_cap on
 * NLDEV. A reader that finds an rdma_qp_cap with all fields unset
 * should treat the QP as "shape unknown, restore will need a blob".
 */
message rdma_qp_cap {
	optional uint32		max_send_wr		= 1;
	optional uint32		max_recv_wr		= 2;
	optional uint32		max_send_sge		= 3;
	optional uint32		max_recv_sge		= 4;
	optional uint32		max_inline_data		= 5;
};

/*
 * GRH / RoCE address vector tail. Embedded inside rdma_ah_attrs
 * (and inside rdma_qp_attrs.av / .alt_av). Present iff the
 * underlying ah_attr has GRH bit set, which is always true on RoCE.
 *
 * Contents mirror struct ib_global_route / rdma_ah_attr.grh,
 * encoded as bytes for raw 16-byte GID values to avoid endian
 * gymnastics on the wire.
 *
 * Fields are optional because GRH is not exposed by NLDEV; the
 * data lives in libibverbs userspace state and (for QPs in INIT+)
 * in driver state. Filled at S5/S6 from LIST_UOBJS + per-driver
 * QUERY callbacks. dgid stays bytes-typed but no longer
 * `required` so partial AH/QP entries decode cleanly.
 */
message rdma_grh_attrs {
	optional bytes		dgid			= 1;	/* 16 bytes */
	optional uint32		sgid_index		= 2;
	optional uint32		hop_limit		= 3;
	optional uint32		traffic_class		= 4;
	optional uint32		flow_label		= 5;
};

/*
 * Address vector. Mirrors struct rdma_ah_attr. Used both as a
 * standalone AH uobject's payload and as the path/altpath inside
 * a QP. ROCE-specific dmac is optional because IB-only AH attrs
 * don't carry it.
 *
 * All fields are optional in the wire format: AH itself is
 * deferred to S5 (needs K2 LIST_UOBJS) and the QP-embedded
 * av/alt_av is filled from LIST_UOBJS + plugin blob at S5/S6.
 * S1.b emits no rdma_ah_attrs.
 */
message rdma_ah_attrs {
	optional uint32		ah_attr_type		= 1;	/* IB / ROCE / OPA */
	optional uint32		port_num		= 2;
	optional uint32		sl			= 3;
	optional uint32		src_path_bits		= 4;
	optional uint32		static_rate		= 5;
	optional rdma_grh_attrs	grh			= 6;
	optional bytes		dmac			= 10;	/* 6 bytes, ROCE */
};

/*
 * QP hw-agnostic state. Combination of init_attr fields (set at
 * create) and qp_attr fields (set across the modify_qp transition
 * chain INIT -> RTR -> RTS). Identity hints (qp_num, sq_psn,
 * rq_psn) are populated by S1.b from NLDEV; the kernel restore
 * handler decides whether failure to honour is fail-loud or silent
 * fallback (per the doc's identity-continuity policy table).
 *
 * Wire-format note: all fields are optional. NLDEV's
 * fill_res_qp_entry today emits qp_type, qp_state, qp_num,
 * dest_qp_num, sq_psn, rq_psn, port_num. Everything else (cap,
 * create_flags, q_key, av, alt_av, path_mtu, timer/retry knobs,
 * rd_atomic, pkey_index, qp_access_flags, ...) is *not* on
 * NLDEV today and is filled at S2/S3+ via the plugin blob (or a
 * future kernel emission). S1.b emits the NLDEV-derived subset.
 */
message rdma_qp_attrs {
	/* From ib_qp_init_attr */
	optional uint32		qp_type			= 1;	/* RC/UC/UD/...   */
	optional rdma_qp_cap	cap			= 2;
	optional uint32		sq_sig_type		= 3;
	optional uint32		create_flags		= 4;
	/* From ib_qp_attr -- the full transition state */
	optional uint32		state			= 10;
	optional uint32		qp_num			= 11;	/* identity hint  */
	optional uint32		dest_qp_num		= 12;
	optional uint32		sq_psn			= 13;
	optional uint32		rq_psn			= 14;
	optional uint32		q_key			= 15;
	optional rdma_ah_attrs	av			= 16;
	optional rdma_ah_attrs	alt_av			= 17;
	optional uint32		path_mtu		= 18;
	optional uint32		retry_cnt		= 19;
	optional uint32		rnr_retry		= 20;
	optional uint32		timeout			= 21;
	optional uint32		rnr_timer		= 22;
	optional uint32		max_rd_atomic		= 23;
	optional uint32		max_dest_rd_atomic	= 24;
	optional uint32		min_rnr_timer		= 25;
	optional uint32		pkey_index		= 26;
	optional uint32		port_num		= 27;
	optional uint32		alt_pkey_index		= 28;
	optional uint32		alt_port_num		= 29;
	optional uint32		qp_access_flags		= 30;
	optional uint32		sq_draining		= 31;

	/*
	 * Userspace tag the source passed as ibv_create_qp()'s
	 * qp_context parameter, mirrored into ibqp->uobject->user_handle
	 * by ib_uverbs_create_qp. RESTORE_QP takes this as a MANDATORY
	 * input via UVERBS_ATTR_RESTORE_QP_USER_HANDLE; the kernel
	 * stamps the new ib_uobject->user_handle with it so library
	 * code that caches the tag survives the round-trip.
	 *
	 * Provenance:
	 *   mlx5: MLX5_IB_METHOD_VFMIG_QUERY_QP.RESP_USER_HANDLE,
	 *         filled at S6b B5 (kernel commit 760534e909c2).
	 *   rxe:  the future RXE_METHOD_VFMIG_QUERY_QP companion (S6a;
	 *         pending). Until then the field is absent and the
	 *         restore-side encoder emits 0 (matches v0 holders that
	 *         all pass NULL for ibv_create_qp's qp_context arg).
	 *
	 * NLDEV does not emit user_handle for QP; this is a per-driver
	 * QUERY_QP-only field (the same shape as RESP_BLOB above).
	 */
	optional uint64		user_handle		= 40;
};

/*
 * MR hw-agnostic state. virt_addr/length/access_flags reproduce
 * the user's ibv_reg_mr() arguments. lkey/rkey are identity hints
 * the kernel restore handler attempts to honour (fail-loud per
 * the doc's policy table -- rkey is wire-visible). iova may
 * differ from virt_addr when the MR was registered with an
 * explicit IOVA.
 *
 * Field provenance:
 *   length        NLDEV RES_MRLEN. S1.b populates.
 *   lkey, rkey    NLDEV RES_LKEY/RES_RKEY -- only emitted when
 *                 dumper has CAP_NET_ADMIN, which CRIU does as
 *                 root. S1.b populates.
 *   iova          NLDEV RES_IOVA. S1.b populates.
 *   virt_addr     not in NLDEV (only iova is); plugin blob in
 *                 S3+. Optional.
 *   access_flags  not in NLDEV; plugin blob. Optional.
 */
message rdma_mr_attrs {
	optional uint64		virt_addr		= 1;
	optional uint64		length			= 2;
	optional uint32		access_flags		= 3;
	optional uint32		lkey			= 10;	/* identity hint  */
	optional uint32		rkey			= 11;	/* identity hint  */
	optional uint64		iova			= 12;
};

/*
 * SRQ hw-agnostic state. Mirrors ib_srq_init_attr's standard
 * fields plus the live srq_limit. XRC SRQ adds an XRCD xref
 * (deferred).
 *
 * Field provenance:
 *   srq_type    NLDEV RES_TYPE. S1.b populates.
 *   max_wr,
 *   max_sge,
 *   srq_limit   not in NLDEV; plugin blob (or future kernel
 *               emission). Optional.
 */
message rdma_srq_attrs {
	optional uint32		srq_type		= 1;	/* BASIC / XRC    */
	optional uint32		max_wr			= 2;
	optional uint32		max_sge			= 3;
	optional uint32		srq_limit		= 4;
};

/*
 * Comp channel and async event fd are uobjects (UVERBS_TYPE_ALLOC_FD)
 * additionally exposed as fd numbers in the user's fd table. The
 * uobject install lives in the per-uobj restore verb path; the
 * fd-table install reuses CRIU's existing fd machinery, keyed off
 * user_fd_no. user_fd_no is the fd number the source process held;
 * restore installs the destination-side fd at the same number.
 */
message rdma_cc_attrs {
	required uint32		user_fd_no		= 1;
};

message rdma_aef_attrs {
	required uint32		user_fd_no		= 1;
};

/* ---------------- top-level per-uobject record ---------------- */

/*
 * One per discovered ib_uobject across all dumped uverbs files.
 *
 * Identity:
 *   ufile_id      cross-references uverbs_file_entry.id; names the
 *                 owning ucontext.
 *   hw_driver_id  mirror of the parent uverbs_file_entry.criu_driver
 *                 for image-inspection convenience (so `crit decode
 *                 rdma_uobj.img` can render plugin attribution
 *                 without a join).
 *   type          which uobject class this record carries.
 *   ufile_handle  small per-ufile id user code holds (e.g.
 *                 pd->handle, qp->handle); restore installs the
 *                 new ib_uobject at this value. NOT exposed by
 *                 NLDEV today -- comes from K2 LIST_UOBJS at S5,
 *                 so optional in S1.b dumps.
 *   restrack_id   per-ibdev id; xref edge target (see
 *                 rdma_uobj_xref). Available from NLDEV for PD
 *                 (RES_PDN), CQ (RES_CQN), MR (RES_MRN), SRQ
 *                 (RES_SRQN), AH (via LIST_UOBJS at S5). NOT
 *                 emitted for QP today -- a small kernel patch
 *                 to fill_res_qp_entry would add it; until then
 *                 QP entries are restrack_id-less and cannot be
 *                 xref edge targets (no v0 edge targets QP).
 *
 * Payload:
 *   EXACTLY ONE of pd/cq/qp/mr/srq/ah/cc/aef matches `type`. Reserved-
 *   type entries (DM/DEVX/MW/...) carry the matching sub-message
 *   when added in follow-on stages; v0 emits none.
 *
 *   plugin_blob is the per-plugin opaque hw-specific state (FW pdn,
 *   FW mkey, FW qpn context, ...). Encoding is plugin-defined;
 *   recommended path is a per-plugin protobuf (e.g.
 *   mlx5_vfmig.proto) wrapped as bytes here. criu core never
 *   parses this field.
 *
 *   xref records the typed edges this uobject has into other
 *   uobjects in the same ufile (parent PD, send_cq, recv_cq,
 *   srq, comp_channel). Restore resolves edges through the per-
 *   ufile handle map built up as uobjects are restored in topo
 *   order.
 */
message rdma_uobj_entry {
	required uint32		ufile_id		= 1;
	required rdma_criu_driver hw_driver_id		= 2;
	required r3_uobj_type	type			= 3;
	optional uint32		ufile_handle		= 4;
	optional uint32		restrack_id		= 5;

	/*
	 * mlx5-private FW identity for PD entries. Sourced from
	 * the named driver TLVs ("fw_pdn", "fw_uid") nested under
	 * RDMA_NLDEV_ATTR_DRIVER on the source's NLDEV PD walk
	 * (see rdma_netlink.c::parse_pd_driver_tlvs).
	 *
	 * fw_pdn is the value mlx5 firmware allocated for this PD
	 * (mpd->pdn). It is *not* the same as restrack_id: restrack
	 * ids are per-ibdev xa_alloc_cyclic counters, while
	 * mpd->pdn is what the FW returned for ALLOC_PD. The two
	 * coincide on freshly-booted hosts but diverge once the
	 * restrack idr has wrapped enough to overtake the FW
	 * allocator. mlx5's UVERBS_METHOD_RESTORE_PD takes mpd->pdn
	 * (via mlx5_ib_restore_pd_req.pdn UHW), not restrack_id;
	 * shipping restrack_id where mpd->pdn was expected was the
	 * silent-correctness bug fixed by the kernel's
	 * d4acb54ebd3d. Restore-side rdma_send_restore_pd reads
	 * fw_pdn here. Required-in-practice on PD entries against
	 * any post-d4acb54ebd3d kernel; absent on rxe and on PDs
	 * whose dump pre-dates that kernel patch.
	 *
	 * fw_uid is mpd->uid -- the devx_uid that owns the PD on
	 * the FW side. Zero for non-DEVX libibverbs ucontexts;
	 * non-zero for DEVX-opted-in ucontexts. Recorded per-PD;
	 * the per-ufile common value is also persisted on
	 * mlx5_vfmig_state_entry.source_devx_uid (this same number
	 * is replayed by GET_CONTEXT(MLX5_IB_ALLOC_UCTX_ADOPT_
	 * DEVX_UID) at restore -- see mlx5_vfmig.proto). Carried
	 * here too for image-inspection convenience and for the
	 * dump-time defense-in-depth check that all PDs of one
	 * ufile share fw_uid (a mismatch is a kernel bug).
	 */
	optional uint32		fw_pdn			= 6;
	optional uint32		fw_uid			= 7;

	/* HW-agnostic per-class attrs. EXACTLY ONE matches `type`. */
	optional rdma_pd_attrs	pd			= 10;
	optional rdma_cq_attrs	cq			= 11;
	optional rdma_qp_attrs	qp			= 12;
	optional rdma_mr_attrs	mr			= 13;
	optional rdma_srq_attrs	srq			= 14;
	optional rdma_ah_attrs	ah			= 15;
	optional rdma_cc_attrs	cc			= 16;
	optional rdma_aef_attrs	aef			= 17;

	/* Edges into the same image. */
	repeated rdma_uobj_xref	xref			= 30;

	/*
	 * Plugin-specific opaque blob (FW state). v0 ships the field
	 * but emits empty bytes from S1; first real consumer is S3
	 * (mlx5 PD restore). See plugin .proto files for blob
	 * structure where used.
	 */
	optional bytes		plugin_blob		= 40;
};
