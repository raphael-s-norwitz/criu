syntax = "proto2";

message uverbs_file_entry {
	required uint32		id		= 1;
	optional string		ib_dev		= 2;
	optional uint32		ctxn		= 3;
	/*
	 * Kernel module name backing this ibdev (e.g. "rxe", "mlx5_core").
	 * Source of truth for which provider claims the context on restore.
	 * Always populated on dump; restore fails loudly if the field is
	 * missing or names a driver criu does not know how to talk to.
	 */
	optional string		driver_name	= 4;
	/*
	 * RDMA_DRIVER_* enum value matching driver_name. Hint for the
	 * restore fast path -- restore re-validates against driver_name
	 * if this field is absent or if the resolved enum value would
	 * disagree with driver_name's expansion in the restoring criu's
	 * headers (kernel UAPI enum can grow).
	 */
	optional uint32		driver_id	= 5;
	/*
	 * RdmaCriuDriver (images/rdma_criu.proto) value naming the CRIU
	 * plugin that won claim arbitration for this context at dump time.
	 * Orthogonal to driver_id (the kernel module): driver_id says
	 * "which module backs this ibdev", criu_driver says "which plugin
	 * owns dump+restore for it". Restore dispatches the uverbs cdev
	 * open to the single loaded plugin whose cr_rdma_provided_driver
	 * matches this value, and re-validates that the same plugin still
	 * claims the ibdev on the destination.
	 */
	optional uint32		criu_driver	= 6;
	/*
	 * Where this context was open at dump time: the holding task's pid
	 * and the fd number it held it at.
	 *
	 * Both survive the cycle -- criu restores a task under its original
	 * pid, and setup_and_serve_out() reinstalls each fd at its original
	 * number -- so together they address the same cdev in the restored
	 * process. That is what lets late restore work, after the task is
	 * running again, reach the context: criu's own fd on it is long
	 * gone by then (it was dup2'd into the task and closed), so the only
	 * way back in is pidfd_getfd against the restored task.
	 *
	 * Recorded for the dma-buf MR bind pass; nothing else consumes them.
	 */
	optional uint32		holder_pid	= 7;
	optional uint32		holder_fd	= 8;
};

message uverbs_async_ev_file_entry {
	required uint32		id		= 1;
	optional uint32		ctxn		= 2;
};
